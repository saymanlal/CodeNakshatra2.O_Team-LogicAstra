<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYMAN Documentation</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="docs.css">
</head>
<body>

<button class="mobile-menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">
  <i class="fas fa-bars"></i>
</button>

<div class="docs-wrapper">

  <!-- ── Sidebar ── -->
  <aside class="docs-sidebar" id="docsSidebar">

    <div class="sidebar-header">
      <a href="/" class="sidebar-logo">
        <img src="./public/sayman-logo.png" alt="SAYMAN">
        SAYMAN Docs
      </a>
      <button class="sidebar-close" onclick="toggleSidebar()" aria-label="Close menu">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="sidebar-search">
      <div class="search-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input
          type="text"
          id="docsSearch"
          placeholder="Search docs... (Ctrl+K)"
          oninput="searchDocs()"
          autocomplete="off"
        >
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- populated by renderSidebar() in docs.js -->
    </nav>

  </aside>

  <!-- ── Main content ── -->
  <main class="docs-main">
    <div class="docs-content" id="docsContent">
      <!-- populated by renderContent() in docs.js -->
    </div>
  </main>

  <!-- ── Table of contents ── -->
  <aside class="docs-toc">
    <div class="toc-header">On this page</div>
    <nav class="toc-nav" id="tocNav">
      <!-- populated by updateTOC() in docs.js -->
    </nav>
  </aside>

</div>

<script src="docs.js"></script>
</body>
</html>
